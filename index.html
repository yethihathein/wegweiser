  <script>
    (function () {
      "use strict";

      // Toast Notification Helper
      var toastTimeout = null;
      function showToast(msg) {
        var toast = document.getElementById("ww-toast");
        var msgEl = document.getElementById("ww-toast-msg");
        if (!toast || !msgEl) return;
        msgEl.textContent = msg;
        toast.classList.remove("opacity-0", "translate-y-3", "pointer-events-none");
        toast.classList.add("opacity-100", "translate-y-0");
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(function () {
          toast.classList.add("opacity-0", "translate-y-3", "pointer-events-none");
          toast.classList.remove("opacity-100", "translate-y-0");
        }, 2200);
      }

      // Universal Cross-Device Web Speech API Engine
      var cachedDeVoice = null;
      function findGermanVoice() {
        if (cachedDeVoice) return cachedDeVoice;
        if (!('speechSynthesis' in window)) return null;
        var voices = window.speechSynthesis.getVoices() || [];
        for (var i = 0; i < voices.length; i++) {
          var v = voices[i];
          if (v.lang === 'de-DE' || v.lang === 'de_DE') {
            cachedDeVoice = v;
            return v;
          }
        }
        for (var j = 0; j < voices.length; j++) {
          if (voices[j].lang && voices[j].lang.toLowerCase().indexOf('de') === 0) {
            cachedDeVoice = voices[j];
            return voices[j];
          }
        }
        return null;
      }

      if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = function () {
          cachedDeVoice = null;
          findGermanVoice();
        };
      }

      window.speakDE = function (text, btnEl) {
        if (window.AndroidTTS && typeof window.AndroidTTS.speak === 'function') {
          if (btnEl) {
            btnEl.classList.add("ring-2", "ring-indigo-500", "scale-105");
            setTimeout(function () {
              btnEl.classList.remove("ring-2", "ring-indigo-500", "scale-105");
            }, 1000);
          }
          var cleanText = text.replace(/<[^>]*>/g, '').replace(/[\(\)]/g, '').trim();
          window.AndroidTTS.speak(cleanText);
          return;
        }

        if (!('speechSynthesis' in window)) {
          showToast("Speech synthesis not supported in this browser.");
          return;
        }
        try {
          window.speechSynthesis.cancel();
        } catch (e) {}

        var cleanText = text.replace(/<[^>]*>/g, '').replace(/[\(\)]/g, '').trim();
        var u = new SpeechSynthesisUtterance(cleanText);
        u.lang = 'de-DE';
        u.rate = 0.88; // Natural learner speed

        var voice = findGermanVoice();
        if (voice) u.voice = voice;

        if (btnEl) {
          btnEl.classList.add("ring-2", "ring-indigo-500", "scale-105");
          u.onend = function () {
            btnEl.classList.remove("ring-2", "ring-indigo-500", "scale-105");
          };
          u.onerror = function () {
            btnEl.classList.remove("ring-2", "ring-indigo-500", "scale-105");
          };
        }

        window.speechSynthesis.speak(u);
      };

      // Theme toggle logic (Saved in localStorage)
      var currentTheme = localStorage.getItem("ww_simple_theme") || "system";
      function applyTheme(theme) {
        currentTheme = theme;
        localStorage.setItem("ww_simple_theme", theme);
        var isDark = theme === "dark" || (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (isDark) document.documentElement.classList.add("dark");
        else document.documentElement.classList.remove("dark");
      }
      applyTheme(currentTheme);

      document.getElementById("theme-btn").addEventListener("click", function () {
        var isDark = document.documentElement.classList.contains("dark");
        applyTheme(isDark ? "light" : "dark");
      });

      // Mobile search expand toggle
      var mobileSearchToggle = document.getElementById("mobile-search-toggle");
      var mobileSearchContainer = document.getElementById("mobile-search-container");
      var quickSearchMobile = document.getElementById("quick-search-mobile");
      var mobileSearchClear = document.getElementById("mobile-search-clear");

      if (mobileSearchToggle && mobileSearchContainer) {
        mobileSearchToggle.addEventListener("click", function () {
          var isHidden = mobileSearchContainer.classList.contains("hidden");
          if (isHidden) {
            mobileSearchContainer.classList.remove("hidden");
            if (quickSearchMobile) quickSearchMobile.focus();
          } else {
            mobileSearchContainer.classList.add("hidden");
          }
        });
      }

      if (quickSearchMobile && mobileSearchClear) {
        quickSearchMobile.addEventListener("input", function () {
          if (this.value.length > 0) mobileSearchClear.classList.remove("hidden");
          else mobileSearchClear.classList.add("hidden");
        });
        mobileSearchClear.addEventListener("click", function () {
          quickSearchMobile.value = "";
          mobileSearchClear.classList.add("hidden");
          quickSearchMobile.focus();
        });
      }

      /* ==================================================================== */
      /* DATA REPOSITORIES                                                    */
      /* ==================================================================== */
      var A1_LESSONS = [{"id": "a1-01", "title": "Alphabet, Umlauts & German Pronunciation Rules", "summary": "German spelling is remarkably phonetic: once you master a few vowel pairs and consonant sounds, you can accurately pronounce virtually any word you see.", "rules": [{"label": "Umlauts (ä, ö, ü)", "text": "<strong>ä</strong> sounds like 'e' in 'bed' (<em>Mädchen, Äpfel</em>); <strong>ö</strong> sound: shape lips for 'o' and say 'e' (<em>schön, hören</em>); <strong>ü</strong>: shape lips for 'oo' and say 'ee' (<em>über, für</em>)."}, {"label": "ß (Eszett / Sharp S)", "text": "Pronounced like a voiceless sharp 'ss' (as in 'hiss'). Used after long vowels or diphthongs (<em>Straße, weiß, groß</em>). Swiss German uses 'ss' instead."}, {"label": "Diphthongs: ei vs. ie", "text": "<strong>ei</strong> = sounds like English 'eye' (<em>mein, nein, zwei</em>). <strong>ie</strong> = sounds like long 'ee' (<em>sie, wie, Liebe</em>). Golden trick: pronounce the second letter!"}, {"label": "eu & äu", "text": "Both sound like 'oy' in 'boy' (<em>Euro, heute, Häuser, Bäume</em>)."}, {"label": "Consonants: z, w, v, s, sp/st", "text": "<strong>z</strong> = [ts] (<em>Zug, Zeit</em>); <strong>w</strong> = [v] (<em>Wasser, wo</em>); <strong>v</strong> = [f] in native German words (<em>Vater, viel</em>) but [v] in loanwords (<em>Vase</em>); <strong>s</strong> before vowels = [z] (<em>Sonne, Suppe</em>); <strong>sp / st</strong> at beginning of words = [shp / sht] (<em>Sport, Stadt</em>)."}, {"label": "The Two 'ch' Sounds", "text": "<strong>Ich-Laut</strong>: soft hissing sound after e, i, ä, ö, ü, eu (<em>ich, nicht, möchten</em>); <strong>Ach-Laut</strong>: throaty sound after a, o, u, au (<em>Bach, Koch, Buch, auch</em>)."}], "examples": [{"de": "Guten Tag! Ich heiße Lukas.", "en": "Good day! My name is Lukas."}, {"de": "Ich wohne in Berlin.", "en": "I live in Berlin."}, {"de": "Deutschland ist sehr schön.", "en": "Germany is very beautiful."}, {"de": "Zwei Tassen Kaffee, bitte.", "en": "Two cups of coffee, please."}, {"de": "Sprechen Sie Englisch oder Deutsch?", "en": "Do you speak English or German?"}]}, {"id": "a1-02", "title": "Greetings, Introductions & Formal vs. Informal (du vs. Sie)", "summary": "Learn polite everyday greetings, how to introduce yourself, and when to use formal 'Sie' versus friendly 'du'.", "rules": [{"label": "Everyday Greetings", "text": "<strong>Guten Morgen</strong> (until ~11:00), <strong>Guten Tag</strong> (throughout the day), <strong>Guten Abend</strong> (from ~18:00), <strong>Gute Nacht</strong> (strictly when going to sleep). Informally: <strong>Hallo!</strong>, <strong>Hi!</strong>, or in the South: <strong>Grüß Gott! / Servus!</strong>"}, {"label": "Saying Goodbye", "text": "<strong>Auf Wiedersehen</strong> (formal, in person), <strong>Auf Wiederhören</strong> (on the phone), <strong>Tschüss!</strong> (universal informal goodbye), <strong>Bis bald!</strong> (See you soon!), <strong>Schönes Wochenende!</strong> (Have a nice weekend!)."}, {"label": "du vs. Sie (Crucial Social Distinction)", "text": "<strong>Sie</strong> (always capitalized): used with strangers, professionals, officials, shopkeepers, and superiors. Conjugates like plural 'they'.<br><strong>du</strong>: used with friends, family, children, fellow students, and pets.<br><strong>ihr</strong>: informal plural for a group of friends ('you guys')."}, {"label": "Core Intro Questions", "text": "<em>Wie heißen Sie? / Wie heißt du?</em> (What is your name?)<br><em>Woher kommen Sie? / Woher kommst du?</em> (Where are you from?)<br><em>Wo wohnen Sie? / Wo wohnst du?</em> (Where do you live?)<br><em>Was machen Sie beruflich?</em> (What do you do for a living?)"}], "examples": [{"de": "Hallo! Mein Name ist Sarah.", "en": "Hello! My name is Sarah."}, {"de": "Wie geht es Ihnen? — Danke, gut! Und Ihnen?", "en": "How are you? (formal) — Thanks, good! And you?"}, {"de": "Wie geht's dir? — Es geht so.", "en": "How are you? (informal) — So-so."}, {"de": "Ich komme aus Spanien, aber ich wohne in München.", "en": "I come from Spain, but I live in Munich."}, {"de": "Sehr angenehm! Freut mich, Sie kennenzulernen.", "en": "Pleased to meet you! Nice to meet you."}]}, {"id": "a1-03", "title": "The Core Foundation: Sein (To Be) & Haben (To Have)", "summary": "The two most essential verbs in the German language. They form the backbone of everyday conversation and future compound tenses.", "rules": [{"label": "Conjugation of 'sein' (irregular)", "text": "<strong>ich bin</strong> (I am), <strong>du bist</strong> (you are), <strong>er/sie/es ist</strong> (he/she/it is), <strong>wir sind</strong> (we are), <strong>ihr seid</strong> (you guys are), <strong>sie/Sie sind</strong> (they / formal you are)."}, {"label": "Conjugation of 'haben' (semi-irregular)", "text": "<strong>ich habe</strong> (I have), <strong>du hast</strong> (you have), <strong>er/sie/es hat</strong> (he/she/it has), <strong>wir haben</strong> (we have), <strong>ihr habt</strong> (you guys have), <strong>sie/Sie haben</strong> (they / formal you have)."}, {"label": "Age Uses 'sein', NOT 'haben'", "text": "In German you say: <em>Ich <strong>bin</strong> 28 Jahre alt</em> (literally: 'I am 28 years old'), never 'ich habe 28 Jahre'."}, {"label": "Idiomatic Expressions with 'haben'", "text": "German uses <em>haben</em> where English uses 'to be':<br>• <strong>Hunger haben</strong> (to be hungry: <em>Ich habe Hunger</em>)<br>• <strong>Durst haben</strong> (to be thirsty: <em>Hast du Durst?</em>)<br>• <strong>Zeit haben</strong> (to have time: <em>Wir haben keine Zeit</em>)<br>• <strong>Angst haben</strong> (to be afraid: <em>Er hat Angst</em>)<br>• <strong>Recht haben</strong> (to be right: <em>Sie haben Recht</em>)."}], "examples": [{"de": "Ich bin müde, aber ich bin glücklich.", "en": "I am tired, but I am happy."}, {"de": "Bist du schon in Frankfurt?", "en": "Are you already in Frankfurt?"}, {"de": "Wir haben heute viel Arbeit.", "en": "We have a lot of work today."}, {"de": "Ich habe großen Hunger und Durst.", "en": "I am very hungry and thirsty."}, {"de": "Sind Sie Herr Müller?", "en": "Are you Mr. Müller?"}]}, {"id": "a1-04", "title": "Regular Verb Conjugation in Präsens (Present Tense)", "summary": "Regular verbs follow an unshakeable pattern of personal endings attached to the verb stem.", "rules": [{"label": "The Golden Ending Rule", "text": "Take the infinitive, drop <strong>-en</strong> to find the stem, then append:<br>• ich: <strong>-e</strong><br>• du: <strong>-st</strong><br>• er/sie/es: <strong>-t</strong><br>• wir: <strong>-en</strong><br>• ihr: <strong>-t</strong><br>• sie/Sie: <strong>-en</strong><br><em>Mnemonic:</em> e - st - t - en - t - en"}, {"label": "Stems Ending in -d or -t", "text": "If a verb stem ends in <strong>-d</strong> or <strong>-t</strong> (e.g. <em>arbeiten, finden, antworten</em>), insert an extra <strong>-e-</strong> before endings for pronunciation ease:<br><em>du arbeit<strong>est</strong>, er arbeit<strong>et</strong>, ihr arbeit<strong>et</strong></em>."}, {"label": "Stems Ending in -s, -ß, -z", "text": "If the stem ends in a hissing sound (e.g. <em>heißen, reisen, tanzen</em>), the <em>du</em> form only adds <strong>-t</strong> instead of <em>-st</em>:<br><em>du heißt</em> (not 'heißst'), <em>du reist</em>."}], "examples": [{"de": "Ich lerne jeden Tag Deutsch.", "en": "I learn German every day."}, {"de": "Wo wohnst du jetzt?", "en": "Where do you live now?"}, {"de": "Er trinkt gerne Tee am Morgen.", "en": "He likes to drink tea in the morning."}, {"de": "Mein Bruder arbeitet bei einer Bank.", "en": "My brother works at a bank."}, {"de": "Wir machen am Wochenende eine Reise.", "en": "We are making a trip on the weekend."}]}, {"id": "a1-05", "title": "Numbers (0–1,000), Telling Time & Time Prepositions", "summary": "Master German numbers, inverted tens, 24h vs. casual time, and the three golden time prepositions (um, am, im).", "rules": [{"label": "Numbers 0 to 20", "text": "0: null, 1: eins, 2: zwei, 3: drei, 4: vier, 5: fünf, 6: sechs, 7: sieben, 8: acht, 9: neun, 10: zehn, 11: <strong>elf</strong>, 12: <strong>zwölf</strong>, 13: dreizehn, 14: vierzehn ... 20: zwanzig."}, {"label": "Inverted Tens (21 to 99)", "text": "German says the units FIRST, then 'und', then the tens:<br>• 21 = <strong>einundzwanzig</strong> (one-and-twenty)<br>• 35 = <strong>fünfunddreißig</strong><br>• 99 = <strong>neunundneunzig</strong><br>Tens: 20 zwanzig, 30 dreißig, 40 vierzig, 50 fünfzig, 60 sechzig, 70 siebzig, 80 achtzig, 90 neunzig, 100 (ein)hundert."}, {"label": "Telling Time: Casual vs. Official", "text": "<strong>Official (24h clock):</strong> 14:30 = <em>vierzehn Uhr dreißig</em>; 08:15 = <em>acht Uhr fünfzehn</em>.<br><strong>Casual (Crucial):</strong><br>• <strong>halb drei</strong> = 2:30 (literally: half-way to three!)<br>• <strong>Viertel nach zwei</strong> = 2:15 (quarter past two)<br>• <strong>Viertel vor drei</strong> = 2:45 (quarter to three)."}, {"label": "Time Prepositions: um, am, im", "text": "• <strong>um</strong> + Clock time: <em>um 8:00 Uhr</em> (at 8 o'clock)<br>• <strong>am</strong> (an + dem) + Days & Times of day: <em>am Montag, am Morgen, am Nachmittag, am Wochenende</em> (Exception: <em>in der Nacht</em>)<br>• <strong>im</strong> (in + dem) + Months & Seasons: <em>im Januar, im Sommer</em>."}], "examples": [{"de": "Der Zug fährt um 17:45 Uhr ab.", "en": "The train departs at 17:45."}, {"de": "Treffen wir uns um halb vier?", "en": "Shall we meet at 3:30? (half past three)"}, {"de": "Am Samstag gehe ich ins Kino.", "en": "On Saturday I am going to the cinema."}, {"de": "Mein Geburtstag ist im Oktober.", "en": "My birthday is in October."}, {"de": "Das Buch kostet dreiundvierzig Euro.", "en": "The book costs forty-three euros."}]}, {"id": "a1-06", "title": "Nouns, Genders (der/die/das) & 5 Plural Patterns", "summary": "Every German noun is capitalized and belongs to one of three genders. Learn high-yield suffix rules and the 5 ways nouns form plurals.", "rules": [{"label": "Capitalization & Three Genders", "text": "Every noun in German starts with a CAPITAL letter.<br>• <span class='gender-der'>der</span> (masculine / blue)<br>• <span class='gender-die'>die</span> (feminine / red)<br>• <span class='gender-das'>das</span> (neuter / green)<br>• Plural for ALL genders is always <strong>die</strong>."}, {"label": "100% Guaranteed Gender Clues", "text": "• <strong>die</strong>: Nouns ending in <em>-ung</em> (Zeitung), <em>-heit</em> (Freiheit), <em>-keit</em> (Möglichkeit), <em>-schaft</em> (Freundschaft), <em>-tät</em> (Universität), <em>-ei</em> (Bäckerei), <em>-in</em> (Lehrerin).<br>• <strong>das</strong>: Diminutives ending in <em>-chen</em> (Brötchen, Mädchen) or <em>-lein</em>; nouns from infinitives (das Essen, das Leben); endings <em>-ment</em>, <em>-um</em>.<br>• <strong>der</strong>: Male persons/roles; days, months, seasons; endings <em>-ling</em>, <em>-or</em>, <em>-ismus</em>."}, {"label": "Compound Noun Gender Rule", "text": "In compound nouns (<em>Komposita</em>), the LAST word determines the gender and plural of the whole word:<br><em>die Hand + das Tuch = <strong>das Handtuch</strong></em> (towel)."}, {"label": "The 5 Plural Patterns", "text": "1. <strong>-(e)n</strong>: mostly feminine (<em>die Frau -> die Frauen</em>)<br>2. <strong>-e</strong>: often with umlaut (<em>der Tag -> die Tage, der Baum -> die Bäume</em>)<br>3. <strong>-er</strong>: neuter & masculine with umlaut (<em>das Kind -> die Kinder, das Buch -> die Bücher</em>)<br>4. <strong>-s</strong>: loanwords & abbreviations (<em>das Auto -> die Autos, das Sofa -> die Sofas</em>)<br>5. <strong>No ending / Umlaut only</strong>: nouns ending in -el, -en, -er (<em>der Lehrer -> die Lehrer, der Apfel -> die Äpfel</em>)."}], "examples": [{"de": "Das Mädchen liest eine Zeitung.", "en": "The girl is reading a newspaper."}, {"de": "Der Tisch und die Stühle sind neu.", "en": "The table and the chairs are new."}, {"de": "Wo ist mein Wohnungsschlüssel?", "en": "Where is my apartment key?"}, {"de": "Die Kinder spielen im Garten.", "en": "The children are playing in the garden."}, {"de": "Haben Sie zwei Zimmer frei?", "en": "Do you have two rooms available?"}]}, {"id": "a1-07", "title": "Der Akkusativ: Direct Object & The Masculine Shift", "summary": "Understand cases simply: the Akkusativ is the direct object (the receiver of the action). The best news in German: only masculine changes!", "rules": [{"label": "What is the Akkusativ?", "text": "The subject does the action (Nominativ). The object receiving the action is in the <strong>Akkusativ</strong> (Answers: <em>Wen?</em> = Whom? or <em>Was?</em> = What?)."}, {"label": "The Golden Secret: Only Masculine Changes!", "text": "• <span class='gender-der'>Masculine</span>: der -> <span class='hl-ak'>den</span> | ein -> <span class='hl-ak'>einen</span> | kein -> <span class='hl-ak'>keinen</span><br>• <span class='gender-die'>Feminine</span>: <strong>die</strong> | <strong>eine</strong> | <strong>keine</strong> (UNTOUCHED!)<br>• <span class='gender-das'>Neuter</span>: <strong>das</strong> | <strong>ein</strong> | <strong>kein</strong> (UNTOUCHED!)<br>• <strong>Plural</strong>: <strong>die</strong> | <strong>-</strong> | <strong>keine</strong> (UNTOUCHED!)"}, {"label": "High-Frequency Akkusativ Verbs", "text": "These common verbs almost always require an Akkusativ direct object:<br><em>haben</em> (to have), <em>brauchen</em> (to need), <em>kaufen</em> (to buy), <em>essen</em> (to eat), <em>trinken</em> (to drink), <em>sehen</em> (to see), <em>hören</em> (to hear), <em>suchen</em> (to search for), <em>finden</em> (to find)."}], "examples": [{"de": "Ich habe einen Hund (der Hund -> einen).", "en": "I have a dog."}, {"de": "Wir brauchen einen neuen Tisch.", "en": "We need a new table."}, {"de": "Ich trinke den Kaffee ohne Zucker.", "en": "I drink the coffee without sugar."}, {"de": "Er liest ein Buch und eine Zeitung.", "en": "He is reading a book (das) and a newspaper (die)."}, {"de": "Ich suche meinen Schlüssel (der Schlüssel -> meinen).", "en": "I am looking for my key."}]}, {"id": "a1-08", "title": "Personal Pronouns in Akkusativ (mich, dich, ihn...)", "summary": "Replace direct objects with pronouns: learn how 'ich' becomes 'mich', 'du' becomes 'dich', and 'er' becomes 'ihn'.", "rules": [{"label": "Nominativ vs. Akkusativ Pronouns", "text": "• ich -> <strong>mich</strong> (me)<br>• du -> <strong>dich</strong> (you)<br>• er -> <span class='hl-ak'>ihn</span> (him/it — notice the -n masculine match!)<br>• sie -> <strong>sie</strong> (her/it)<br>• es -> <strong>es</strong> (it)<br>• wir -> <strong>uns</strong> (us)<br>• ihr -> <strong>euch</strong> (you guys)<br>• sie / Sie -> <strong>sie / Sie</strong> (them / formal you)"}, {"label": "Things Take Gender Pronouns", "text": "In German, objects are referred to by their grammatical gender:<br>• <em>Wo ist der Schlüssel? — Ich habe <strong>ihn</strong>!</em> ('ihn' because key is masculine)<br>• <em>Wo ist die Tasche? — Ich sehe <strong>sie</strong>.</em><br>• <em>Wo ist das Buch? — Ich lese <strong>es</strong>.</em>"}], "examples": [{"de": "Liebst du mich? — Ja, ich liebe dich!", "en": "Do you love me? — Yes, I love you!"}, {"de": "Ich kenne ihn seit vielen Jahren.", "en": "I have known him for many years."}, {"de": "Siehst du den Park? — Ja, ich sehe ihn.", "en": "Do you see the park? — Yes, I see it."}, {"de": "Der Lehrer fragt uns, aber wir verstehen ihn nicht.", "en": "The teacher asks us, but we do not understand him."}, {"de": "Ich rufe Sie morgen an, Herr Weber.", "en": "I will call you tomorrow, Mr. Weber."}]}, {"id": "a1-09", "title": "Possessive Articles (mein, dein, sein, ihr, unser, euer)", "summary": "Express ownership cleanly. Learn the base possessive stems and how they add endings just like 'ein/eine'.", "rules": [{"label": "The 6 Base Possessive Stems", "text": "• <strong>mein</strong> (my)<br>• <strong>dein</strong> (your informal)<br>• <strong>sein</strong> (his / its)<br>• <strong>ihr</strong> (her)<br>• <strong>unser</strong> (our)<br>• <strong>euer</strong> (your plural / 'y'all's')<br>• <strong>ihr / Ihr</strong> (their / formal your)"}, {"label": "Endings Match 'ein / eine'", "text": "Add endings based on gender & case:<br>• <strong>Masculine Nom:</strong> mein Vater | <strong>Akk:</strong> <span class='hl-ak'>meinen</span> Vater<br>• <strong>Feminine Nom & Akk:</strong> meine Mutter<br>• <strong>Neuter Nom & Akk:</strong> mein Kind<br>• <strong>Plural Nom & Akk:</strong> meine Eltern"}, {"label": "Special Spelling: euer -> eure", "text": "When <strong>euer</strong> takes an ending, the middle 'e' drops out:<br><em>euer Haus</em>, BUT <em>eur<strong>e</strong> Mutter</em>, <em>eur<strong>en</strong> Vater</em> (not 'eueren')."}], "examples": [{"de": "Das ist meine Schwester und das ist mein Bruder.", "en": "That is my sister and that is my brother."}, {"de": "Wo ist deine Tasche?", "en": "Where is your bag?"}, {"de": "Er sucht seinen Pass (der Pass -> seinen).", "en": "He is looking for his passport."}, {"de": "Unsere Wohnung hat drei Zimmer.", "en": "Our apartment has three rooms."}, {"de": "Ist das Ihr Koffer, Frau Müller?", "en": "Is this your suitcase, Ms. Müller?"}]}, {"id": "a1-10", "title": "German Word Order: The V2 Rule, Questions & Inversion", "summary": "The single most important structural law in German: the conjugated verb MUST occupy Position 2 in statements. Learn inversion and question forms.", "rules": [{"label": "The Sacred V2 Rule", "text": "In every standard German main clause (<em>Hauptsatz</em>), the conjugated verb is <strong>ALWAYS in Position 2</strong>.<br>• [1: Ich] [2: <strong>gehe</strong>] [3: heute ins Kino].<br>• [1: Heute] [2: <strong>gehe</strong>] [3: ich ins Kino]."}, {"label": "Inversion: When Position 1 is Not the Subject", "text": "German allows any element (time, location, object) in Position 1 for emphasis. When you put time or place first, the subject immediately flips behind the verb into Position 3:<br><em>Morgen <strong>spiele</strong> ich Fußball</em> (NOT 'Morgen ich spiele')."}, {"label": "Yes/No Questions (Verb in Position 1)", "text": "In questions answered with Ja or Nein, the verb moves directly to <strong>Position 1</strong>:<br><em><strong>Kommst</strong> du heute zur Party? — Ja!</em><br><em><strong>Haben</strong> Sie ein Zimmer frei?</em>"}, {"label": "W-Questions (W-Fragen)", "text": "W-Word takes Position 1, verb stays firmly in <strong>Position 2</strong>:<br>• <strong>Wer</strong> (who), <strong>Was</strong> (what), <strong>Wo</strong> (where), <strong>Wohin</strong> (where to), <strong>Woher</strong> (where from), <strong>Wann</strong> (when), <strong>Warum</strong> (why), <strong>Wie</strong> (how).<br><em>Wo <strong>wohnt</strong> deine Familie?</em>"}], "examples": [{"de": "Heute lerne ich vier Stunden Deutsch.", "en": "Today I am learning German for four hours."}, {"de": "In Berlin gibt es viele Museen.", "en": "In Berlin there are many museums."}, {"de": "Verstehst du diesen Satz?", "en": "Do you understand this sentence?"}, {"de": "Wann beginnt der Unterricht?", "en": "When does the class begin?"}, {"de": "Warum bist du so müde?", "en": "Why are you so tired?"}]}, {"id": "a1-11", "title": "Stem-Changing Irregular Verbs in Präsens", "summary": "Many common verbs change their root vowel in the 2nd (du) and 3rd (er/sie/es) person singular. Plurals remain totally normal.", "rules": [{"label": "The 3 Major Vowel Shifts", "text": "The change occurs ONLY for <strong>du</strong> and <strong>er/sie/es</strong>:<br>1. <strong>e -> i</strong>: <em>sprechen</em> (du sprichst, er spricht); <em>essen</em> (du isst, er isst); <em>helfen</em> (du hilfst, er hilft); <em>treffen</em> (du triffst).<br>2. <strong>e -> ie</strong>: <em>sehen</em> (du siehst, er sieht); <em>lesen</em> (du liest, er liest).<br>3. <strong>a -> ä</strong>: <em>fahren</em> (du fährst, er fährt); <em>schlafen</em> (du schläfst, er schläft); <em>waschen</em> (du wäschst, er wäscht); <em>tragen</em> (du trägst)."}, {"label": "Special Case: nehmen", "text": "<em>nehmen</em> (to take) changes to 'imm':<br><em>ich nehme, <strong>du nimmst, er nimmt</strong>, wir nehmen, ihr nehmt, sie nehmen</em>."}, {"label": "Plural Forms Never Change Stem", "text": "Notice that <em>wir</em> (wir fahren), <em>ihr</em> (ihr fahrt), and <em>sie</em> (sie fahren) retain the original stem vowel without an umlaut!"}], "examples": [{"de": "Er spricht fließend Deutsch und Englisch.", "en": "He speaks German and English fluently."}, {"de": "Siehst du den Vogel dort?", "en": "Do you see the bird over there?"}, {"de": "Mein Vater fährt jeden Tag mit dem Zug.", "en": "My father travels by train every day."}, {"de": "Was isst du heute zu Mittag?", "en": "What are you eating today for lunch?"}, {"de": "Er nimmt einen Kaffee mit Milch.", "en": "He takes a coffee with milk."}]}, {"id": "a1-12", "title": "Negation in German: nicht vs. kein", "summary": "Master the difference between 'kein' (negating indefinite/zero-article nouns) and 'nicht' (negating verbs, adjectives, names, and definite nouns).", "rules": [{"label": "When to use 'kein'", "text": "Use <strong>kein</strong> ONLY when negating a noun that would otherwise have an indefinite article (<em>ein/eine</em>) or NO article (<em>Nullartikel</em>):<br>• <em>Ich habe ein Auto -> Ich habe <strong>kein</strong> Auto.</em><br>• <em>Ich habe Zeit -> Ich habe <strong>keine</strong> Zeit.</em><br>• <em>Trinkst du Bier? -> Nein, ich trinke <strong>kein</strong> Bier.</em>"}, {"label": "When to use 'nicht'", "text": "Use <strong>nicht</strong> for everything else:<br>• Verbs: <em>Ich rauche <strong>nicht</strong>.</em><br>• Adjectives: <em>Das Zimmer ist <strong>nicht</strong> groß.</em><br>• Specific nouns with 'der/die/das': <em>Das ist <strong>nicht</strong> der Chef.</em><br>• Possessives: <em>Das ist <strong>nicht</strong> mein Handy.</em><br>• Proper names: <em>Ich bin <strong>nicht</strong> Thomas.</em>"}, {"label": "Position of 'nicht'", "text": "• Negating an entire simple sentence: <em>nicht</em> goes at the <strong>end</strong> (<em>Ich verstehe das nicht</em>).<br>• Negating a specific word/phrase: <em>nicht</em> goes <strong>directly before</strong> it (<em>Ich wohne nicht in Berlin, sondern in Köln</em>)."}], "examples": [{"de": "Ich habe keine Geschwister.", "en": "I have no siblings."}, {"de": "Das Wetter ist heute leider nicht schön.", "en": "Unfortunately the weather is not nice today."}, {"de": "Wir verstehen diese Regel noch nicht.", "en": "We do not understand this rule yet."}, {"de": "Er kommt heute nicht zur Arbeit.", "en": "He is not coming to work today."}, {"de": "Ich trinke keinen Kaffee am Abend.", "en": "I drink no coffee in the evening."}]}, {"id": "a1-13", "title": "Modal Verbs in Präsens & The Sentence Bracket (Satzklammer)", "summary": "Express ability, necessity, permission, and desire with the 6 German modal verbs, creating the iconic 'Sentence Bracket'.", "rules": [{"label": "The 6 Modal Verbs & Meanings", "text": "• <strong>können</strong> (can, to be able to)<br>• <strong>müssen</strong> (must, to have to)<br>• <strong>wollen</strong> (to want to)<br>• <strong>dürfen</strong> (may, to be allowed to)<br>• <strong>sollen</strong> (should, to be supposed to)<br>• <strong>möchten</strong> (would like to — polite form of mögen)"}, {"label": "Irregular Singular Forms", "text": "Modal verbs change their vowel in singular, and <strong>ich</strong> and <strong>er/sie/es</strong> have NO ENDING:<br>• können: <em>ich kann, du kannst, er kann</em><br>• müssen: <em>ich muss, du musst, er muss</em><br>• wollen: <em>ich will, du willst, er will</em><br>• dürfen: <em>ich darf, du darfst, er darf</em>"}, {"label": "The Sentence Bracket (Satzklammer)", "text": "The conjugated modal verb sits firmly in <strong>Position 2</strong>, and the main action verb in infinitive form is kicked to the <strong>VERY END</strong> of the sentence:<br>• <em>Ich [kann] sehr gut Deutsch [sprechen].</em><br>• <em>Wir [müssen] heute bis 18 Uhr [arbeiten].</em>"}], "examples": [{"de": "Ich kann sehr gut schwimmen.", "en": "I can swim very well."}, {"de": "Hier darf man nicht parken.", "en": "One is not allowed to park here."}, {"de": "Wir wollen am Samstag ins Museum gehen.", "en": "We want to go to the museum on Saturday."}, {"de": "Ich möchte bitte einen Kaffee bestellen.", "en": "I would like to order a coffee, please."}, {"de": "Du musst deine Hausaufgaben machen.", "en": "You have to do your homework."}]}, {"id": "a1-14", "title": "Akkusativ Prepositions (DOGFU) & The Imperative", "summary": "Master the prepositions that always trigger the Akkusativ, plus how to give polite commands and instructions (Imperative).", "rules": [{"label": "The 5 Strict Akkusativ Prepositions (DOGFU)", "text": "These prepositions <strong>ALWAYS</strong> force the noun into the Akkusativ case:<br>• <strong>D</strong>urch (through): <em>Wir gehen durch den Park.</em><br>• <strong>O</strong>hne (without): <em>Ich trinke Kaffee ohne Zucker.</em><br>• <strong>G</strong>egen (against / around time): <em>Er fährt gegen einen Baum / gegen 8 Uhr.</em><br>• <strong>F</strong>ür (for): <em>Das Geschenk ist für meinen Vater.</em><br>• <strong>U</strong>m (around / at time): <em>Wir sitzen um den Tisch / um 10 Uhr.</em>"}, {"label": "The Imperative: Giving Commands", "text": "How to instruct or command in German:<br>• <strong>du-form:</strong> Take 'du' present form, drop '-st' and drop 'du': <em>Komm! Trink! Fahr! Mach!</em> (Special: <em>Sei ruhig!</em> = Be quiet!)<br>• <strong>ihr-form:</strong> Just the normal 'ihr' verb, drop 'ihr': <em>Kommt! Trinkt! Macht!</em><br>• <strong>Sie-form:</strong> Verb + Sie + bitte: <em>Kommen Sie bitte! Trinken Sie!</em>"}], "examples": [{"de": "Dieses Buch ist ein Geschenk für meinen Freund.", "en": "This book is a present for my friend."}, {"de": "Ohne einen Regenschirm gehe ich heute nicht raus.", "en": "Without an umbrella I am not going out today."}, {"de": "Öffnen Sie bitte das Fenster!", "en": "Please open the window!"}, {"de": "Komm schnell, der Film fängt an!", "en": "Come quickly, the movie is starting!"}, {"de": "Sei nicht so ungeduldig!", "en": "Don't be so impatient!"}]}];
      var A2_LESSONS = [{"id": "a2-01", "title": "Der Dativ: The Indirect Object & Dative Verbs", "summary": "Step into A2 with the Dativ case: the recipient or beneficiary of an action. Learn the article transformations and verbs that natively demand Dativ.", "rules": [{"label": "What is the Dativ?", "text": "The Dativ answers the question: <strong>Wem?</strong> (To whom? / For whom?). It represents the indirect object receiving something."}, {"label": "Dativ Article Changes (The 'M-R-M-N' Rule)", "text": "• <span class='gender-der'>Masculine</span>: der / ein -> <span class='hl-dat'>dem / einem</span><br>• <span class='gender-die'>Feminine</span>: die / eine -> <span class='hl-dat'>der / einer</span> (die changes to der!)<br>• <span class='gender-das'>Neuter</span>: das / ein -> <span class='hl-dat'>dem / einem</span><br>• <strong>Plural</strong>: die / keine -> <span class='hl-dat'>den / keinen + -n</span> appended to the noun (e.g. <em>den Kindern</em>)."}, {"label": "Core Verbs that Require Dativ", "text": "These verbs always take a Dativ object instead of an Akkusativ object:<br>• <strong>helfen</strong> (to help): <em>Ich helfe dem Mann.</em><br>• <strong>danken</strong> (to thank): <em>Ich danke dir.</em><br>• <strong>gefallen</strong> (to please / to like): <em>Das Haus gefällt mir.</em><br>• <strong>gehören</strong> (to belong to): <em>Das Auto gehört meinem Vater.</em><br>• <strong>schmecken</strong> (to taste good to): <em>Die Pizza schmeckt den Kindern.</em><br>• <strong>passen</strong> (to fit/suit): <em>Die Hose passt mir gut.</em>"}], "examples": [{"de": "Ich gebe dem Mann das Buch.", "en": "I give the man (Dativ) the book (Akkusativ)."}, {"de": "Kannst du der Frau bitte helfen?", "en": "Can you please help the woman?"}, {"de": "Das Essen schmeckt meinen Freunden sehr gut.", "en": "The food tastes very good to my friends."}, {"de": "Wem gehört dieses Fahrrad? — Es gehört mir.", "en": "Whom does this bike belong to? — It belongs to me."}, {"de": "Ich gratuliere dir zum Geburtstag!", "en": "I congratulate you on your birthday!"}]}, {"id": "a2-02", "title": "Dative Prepositions & Everyday Contractions", "summary": "Master the prepositions that ALWAYS command the Dativ case, along with essential spoken German contractions like beim, zum, and im.", "rules": [{"label": "The Strict Dativ Prepositions", "text": "These prepositions <strong>ALWAYS</strong> force the Dativ case, no matter what:<br>• <strong>aus</strong> (out of, from)<br>• <strong>bei</strong> (at, with, near)<br>• <strong>mit</strong> (with, by means of transport)<br>• <strong>nach</strong> (to cities/countries, after)<br>• <strong>seit</strong> (since, for [duration])<br>• <strong>von</strong> (from, of)<br>• <strong>zu</strong> (to [people, places])<br>• <strong>gegenüber</strong> (opposite to)<br><em>Catchy rhyme:</em> Aus, bei, mit, nach, seit, von, zu — immer mit dem Dativ, weißt du!"}, {"label": "Essential Contractions", "text": "In natural German, prepositions merge with 'dem' or 'der':<br>• bei + dem = <strong>beim</strong> (<em>beim Arzt, beim Bäcker</em>)<br>• von + dem = <strong>vom</strong> (<em>vom Bahnhof</em>)<br>• zu + dem = <strong>zum</strong> (<em>zum Supermarkt, zum Frühstück</em>)<br>• zu + der = <strong>zur</strong> (<em>zur Arbeit, zur Schule, zur Bank</em>)<br>• in + dem = <strong>im</strong> (<em>im Restaurant</em>)."}], "examples": [{"de": "Ich fahre jeden Tag mit der U-Bahn zur Arbeit.", "en": "I travel every day by subway to work."}, {"de": "Er wohnt seit einem Jahr in Deutschland.", "en": "He has been living in Germany for one year."}, {"de": "Ich komme gerade vom Arzt.", "en": "I am just coming from the doctor."}, {"de": "Wir gehen nach dem Essen im Park spazieren.", "en": "After the meal we are going for a walk in the park."}, {"de": "Die Apotheke liegt gegenüber dem Bahnhof.", "en": "The pharmacy is located opposite the train station."}]}, {"id": "a2-03", "title": "Personal Pronouns in Dativ (mir, dir, ihm, ihr...)", "summary": "Master indirect object pronouns: learn how to say 'to me', 'to you', 'to her', and standard social phrases like 'Es tut mir leid' and 'Wie geht es dir?'.", "rules": [{"label": "Complete Dativ Pronoun Chart", "text": "• ich -> <span class='hl-dat'>mir</span> (to me)<br>• du -> <span class='hl-dat'>dir</span> (to you)<br>• er / es -> <span class='hl-dat'>ihm</span> (to him / to it)<br>• sie -> <span class='hl-dat'>ihr</span> (to her)<br>• wir -> <strong>uns</strong> (to us)<br>• ihr -> <strong>euch</strong> (to you guys)<br>• sie / Sie -> <span class='hl-dat'>ihnen / Ihnen</span> (to them / to formal you)"}, {"label": "High-Yield Conversational Idioms", "text": "• <em>Wie geht es dir? — Es geht <strong>mir</strong> gut!</em> (How is it going to you?)<br>• <em>Es tut <strong>mir</strong> leid.</em> (I am sorry / literally: it does sorrow to me)<br>• <em><strong>Mir</strong> ist kalt / warm.</em> (I am cold / warm — never say 'ich bin kalt', which means you are dead or emotionally frigid!)<br>• <em>Kannst du <strong>mir</strong> bitte helfen?</em> (Can you please help me?)"}], "examples": [{"de": "Wie geht es Ihnen, Frau Schmidt? — Es geht mir blendend!", "en": "How are you, Ms. Schmidt? — I am doing splendidly!"}, {"de": "Ich gebe dir morgen mein Buch zurück.", "en": "I will give you back my book tomorrow."}, {"de": "Gefällt ihm die neue Wohnung?", "en": "Does he like the new apartment?"}, {"de": "Können Sie uns den Weg erklären?", "en": "Can you explain the way to us?"}, {"de": "Mir ist heute sehr kalt.", "en": "I feel very cold today."}]}, {"id": "a2-04", "title": "Wechselpräpositionen (Two-Way Prepositions): Wo? vs. Wohin?", "summary": "The crown jewel of German spatial grammar: the 9 prepositions that take Dativ for static location (Wo?) and Akkusativ for direction/destination (Wohin?).", "rules": [{"label": "The 9 Two-Way Prepositions", "text": "<strong>an, auf, hinter, in, neben, über, unter, vor, zwischen</strong><br>These prepositions do NOT belong exclusively to one case. Their case depends on intent!"}, {"label": "The Universal Rule: Wo? vs. Wohin?", "text": "• <strong>Wo? (Where? / Static Location / State of Rest) -> DATIV!</strong><br><em>Das Buch liegt <strong>auf dem</strong> Tisch.</em> (Where is it lying? On the table)<br><em>Wir sitzen <strong>im</strong> (in dem) Restaurant.</em><br><br>• <strong>Wohin? (Where to? / Direction / Destination / Motion across boundary) -> AKKUSATIV!</strong><br><em>Ich lege das Buch <strong>auf den</strong> Tisch.</em> (Where am I placing it? Onto the table)<br><em>Wir gehen <strong>in das</strong> Restaurant.</em>"}, {"label": "Movement Within a Place vs. Movement To a Place", "text": "Careful: If you are jogging inside the park (no destination boundary crossed), it is <em>Wo?</em> -> Dativ: <em>Ich jogge <strong>im</strong> Park.</em> If entering the park from outside: <em>Ich gehe <strong>in den</strong> Park</em> (Akkusativ)."}], "examples": [{"de": "Die Lampe hängt über dem Tisch (Wo? -> Dativ).", "en": "The lamp is hanging over the table."}, {"de": "Ich hänge das Bild an die Wand (Wohin? -> Akkusativ).", "en": "I hang the picture onto the wall."}, {"de": "Er steht vor der Tür (Wo? -> Dativ).", "en": "He is standing in front of the door."}, {"de": "Sie setzt sich zwischen die zwei Kinder (Wohin? -> Akkusativ).", "en": "She sits down between the two children."}, {"de": "Die Katze schläft unter dem Bett (Wo? -> Dativ).", "en": "The cat is sleeping under the bed."}]}, {"id": "a2-05", "title": "Action Verbs vs. Position Verbs (The Word Pairs)", "summary": "German strictly separates the action of putting something (transitive + Akkusativ) from the state of resting (intransitive + Dativ).", "rules": [{"label": "The 4 Classic Verb Pairs", "text": "1. <strong>stellen</strong> (to stand something upright, + Akk) vs. <strong>stehen</strong> (to be standing, + Dat)<br>2. <strong>legen</strong> (to lay something flat, + Akk) vs. <strong>liegen</strong> (to be lying down, + Dat)<br>3. <strong>setzen</strong> (to seat/set, + Akk) vs. <strong>sitzen</strong> (to be sitting, + Dat)<br>4. <strong>hängen</strong> (to hang something up, + Akk) vs. <strong>hängen</strong> (to be hanging, + Dat)"}, {"label": "Regular vs. Irregular Forms", "text": "• The <strong>Action verbs</strong> (stellen, legen, setzen) are always REGULAR verbs and take <em>haben</em> in Perfekt: <em>hat gestellt, hat gelegt, hat gesetzt</em>.<br>• The <strong>Position verbs</strong> (stehen, liegen, sitzen) are IRREGULAR and describe state: <em>hat gestanden / ist gestanden</em>, <em>hat gelegen / ist gelegen</em>, <em>hat gesessen / ist gesessen</em>."}], "examples": [{"de": "Ich stelle die Flasche auf den Tisch (Action -> Akk).", "en": "I put the bottle upright onto the table."}, {"de": "Die Flasche steht auf dem Tisch (State -> Dat).", "en": "The bottle is standing on the table."}, {"de": "Er legt das Buch auf das Bett (Action -> Akk).", "en": "He lays the book onto the bed."}, {"de": "Das Buch liegt auf dem Bett (State -> Dat).", "en": "The book is lying on the bed."}, {"de": "Sie setzt sich auf den Stuhl (Action -> Akk).", "en": "She sits down onto the chair."}]}, {"id": "a2-06", "title": "Das Perfekt with haben: Spoken Past Tense", "summary": "In spoken German, almost all past events are told using the Perfekt (Hilfsverb + Partizip II). Master the rules for forming the past participle.", "rules": [{"label": "The Perfekt Formula", "text": "<strong>haben (conjugated in Position 2) + ... + Partizip II (at the very end)</strong><br><em>Ich <strong>habe</strong> gestern ein Buch <strong>gekauft</strong>.</em>"}, {"label": "Forming Partizip II (Regular Verbs)", "text": "Formula: <strong>ge- + verb stem + -t</strong><br>• machen -> <em>gemacht</em><br>• kaufen -> <em>gekauft</em><br>• hören -> <em>gehört</em><br>• Stems ending in -d/-t add -et: arbeiten -> <em>gearbeitet</em>."}, {"label": "Verbs Ending in -ieren (NO ge-!)", "text": "Verbs ending in <em>-ieren</em> NEVER take 'ge-'. They simply add <strong>-t</strong>:<br>• studieren -> <em>studiert</em><br>• reservieren -> <em>reserviert</em><br>• reparieren -> <em>repariert</em><br>• telefonieren -> <em>telefoniert</em>."}, {"label": "Inseparable Prefix Verbs (NO ge-!)", "text": "Verbs with prefixes <strong>be-, ge-, emp-, ent-, er-, ver-, zer-</strong> do NOT take 'ge-':<br>• bezahlen -> <em>bezahlt</em><br>• verstehen -> <em>verstanden</em><br>• erklären -> <em>erklärt</em>."}], "examples": [{"de": "Ich habe heute Morgen zwei Tassen Kaffee getrunken.", "en": "I drank two cups of coffee this morning."}, {"de": "Hast du deine Hausaufgaben schon gemacht?", "en": "Have you already done your homework?"}, {"de": "Wir haben gestern einen Tisch im Restaurant reserviert.", "en": "We reserved a table at the restaurant yesterday."}, {"de": "Er hat den ganzen Text ohne Wörterbuch verstanden.", "en": "He understood the entire text without a dictionary."}, {"de": "Was hast du am Wochenende gekauft?", "en": "What did you buy on the weekend?"}]}, {"id": "a2-07", "title": "Das Perfekt with sein: Verbs of Motion & State Change", "summary": "Learn which verbs form their past tense with 'sein' instead of 'haben': movement from point A to B, change of condition, and key exceptions.", "rules": [{"label": "When to Use 'sein' as Auxiliary", "text": "Use <strong>sein</strong> in Perfekt when the verb expresses:<br>1. <strong>Movement / Change of Location (A to B):</strong><br>• <em>gehen -> ist gegangen</em><br>• <em>fahren -> ist gefahren</em><br>• <em>fliegen -> ist geflogen</em><br>• <em>kommen -> ist gekommen</em><br>• <em>laufen -> ist gelaufen</em><br>• <em>reisen -> ist gereist</em><br><br>2. <strong>Change of Physical or Existential State:</strong><br>• <em>aufstehen -> ist aufgestanden</em> (waking up / standing up)<br>• <em>einschlafen -> ist eingeschlafen</em> (falling asleep)<br>• <em>sterben -> ist gestorben</em> (to die)<br><br>3. <strong>The 3 Essential Exceptions (No movement, but use 'sein'!):</strong><br>• <strong>sein</strong> -> <em>ist gewesen</em> (has been)<br>• <strong>bleiben</strong> -> <em>ist geblieben</em> (stayed)<br>• <strong>werden</strong> -> <em>ist geworden</em> (became / turned into)."}], "examples": [{"de": "Ich bin gestern um 23 Uhr eingeschlafen.", "en": "I fell asleep yesterday at 23:00."}, {"de": "Wir sind mit dem Zug nach München gefahren.", "en": "We traveled to Munich by train."}, {"de": "Wann bist du heute aufgestanden?", "en": "When did you get up today?"}, {"de": "Er ist am Wochenende zu Hause geblieben.", "en": "He stayed at home on the weekend."}, {"de": "Sie sind schon nach Italien geflogen.", "en": "They have already flown to Italy."}]}, {"id": "a2-08", "title": "Trennbare Verben (Separable Prefix Verbs) in Present & Past", "summary": "Master German verbs that split apart in the present tense and rejoin with '-ge-' sandwiched inside the past participle.", "rules": [{"label": "Common Separable Prefixes", "text": "<strong>ab-, an-, auf-, aus-, ein-, mit-, nach-, vor-, weg-, zu-, zurück-</strong><br>These prefixes are stressed in pronunciation (<em>Ánrufen, Éinkaufen</em>)."}, {"label": "Present Tense: The Split", "text": "The prefix detaches and flies to the absolute END of the clause:<br>• <em>aufstehen: Ich <strong>stehe</strong> jeden Morgen um 7 Uhr <strong>auf</strong>.</em><br>• <em>einkaufen: Er <strong>kauft</strong> im Supermarkt <strong>ein</strong>.</em><br>• <em>anrufen: Wir <strong>rufen</strong> dich heute Abend <strong>an</strong>.</em>"}, {"label": "Perfekt Tense: The Sandwich (-ge- inside)", "text": "In the Perfekt, <strong>ge-</strong> is inserted between the prefix and the verb stem:<br>• auf + <strong>ge</strong> + standen = <em>aufgestanden</em> (ist aufgestanden)<br>• ein + <strong>ge</strong> + kauft = <em>eingekauft</em> (hat eingekauft)<br>• an + <strong>ge</strong> + rufen = <em>angerufen</em> (hat angerufen)."}, {"label": "With Modal Verbs: No Split!", "text": "When used with a modal verb, the separable verb stays united in infinitive at the end:<br><em>Ich muss morgen um 6 Uhr <strong>aufstehen</strong>.</em>"}], "examples": [{"de": "Der Zug kommt um 15:30 Uhr am Bahnhof an.", "en": "The train arrives at the station at 15:30."}, {"de": "Ich habe gestern alle Freunde zur Party eingeladen.", "en": "I invited all friends to the party yesterday."}, {"de": "Mach bitte das Licht aus!", "en": "Please turn off the light!"}, {"de": "Er hat gestern Abend seine Mutter angerufen.", "en": "He called his mother yesterday evening."}, {"de": "Wann fängt der Sprachkurs an?", "en": "When does the language course start?"}]}, {"id": "a2-09", "title": "Das Präteritum of sein, haben & Modal Verbs", "summary": "While spoken German prefers Perfekt, 'sein', 'haben', and modal verbs are almost always spoken in Präteritum (Simple Past). Learn these essential high-yield forms.", "rules": [{"label": "Präteritum of 'sein' (was / were)", "text": "• ich <strong>war</strong><br>• du <strong>warst</strong><br>• er/sie/es <strong>war</strong> (notice: no ending!)<br>• wir <strong>waren</strong><br>• ihr <strong>wart</strong><br>• sie/Sie <strong>waren</strong>"}, {"label": "Präteritum of 'haben' (had)", "text": "• ich <strong>hatte</strong><br>• du <strong>hattest</strong><br>• er/sie/es <strong>hatte</strong><br>• wir <strong>hatten</strong><br>• ihr <strong>hattet</strong><br>• sie/Sie <strong>hatten</strong>"}, {"label": "Präteritum of Modal Verbs (Drop the Umlaut!)", "text": "All modal verbs lose their umlauts in the Präteritum:<br>• können -> <em>ich konnte, er konnte</em> (could)<br>• müssen -> <em>ich musste, er musste</em> (had to)<br>• wollen -> <em>ich wollte, er wollte</em> (wanted to)<br>• dürfen -> <em>ich durfte, er durfte</em> (was allowed to)"}], "examples": [{"de": "Ich war gestern krank und hatte hohes Fieber.", "en": "I was sick yesterday and had a high fever."}, {"de": "Früher hatten wir ein schönes Haus am See.", "en": "In the past we had a beautiful house by the lake."}, {"de": "Wir konnten gestern leider nicht kommen.", "en": "Unfortunately we could not come yesterday."}, {"de": "Er musste am Wochenende viele E-Mails schreiben.", "en": "He had to write many emails on the weekend."}, {"de": "Wo warst du am Samstagabend?", "en": "Where were you on Saturday evening?"}]}, {"id": "a2-10", "title": "German Word Order: TeKaMoLo & Object Sequence", "summary": "When multiple adverbials crowd a sentence, order them smoothly with TeKaMoLo. Learn the subtle rule of Dativ vs. Akkusativ object sequence.", "rules": [{"label": "The TeKaMoLo Formula", "text": "When providing several pieces of information in one sentence, arrange them in this order:<br>1. <strong>Te</strong>mporal (When?): <em>heute, gestern, um 8 Uhr</em><br>2. <strong>Ka</strong>usal (Why?): <em>wegen des Wetters, aus Liebe</em><br>3. <strong>Mo</strong>dal (How?): <em>mit dem Bus, gern, schnell</em><br>4. <strong>Lo</strong>kal (Where / Where to?): <em>nach Berlin, im Park</em><br><br><em>Example:</em> Ich fahre [heute (Te)] [mit dem Zug (Mo)] [nach München (Lo)]."}, {"label": "Noun Objects: Dativ Before Akkusativ", "text": "When both objects are nouns, the <strong>Dativ object comes first</strong>:<br><em>Ich gebe <strong>dem Mann</strong> (Dat) <strong>das Buch</strong> (Akk).</em>"}, {"label": "Pronoun Objects: Pronoun ALWAYS Wins!", "text": "If an object is replaced by a pronoun, the <strong>pronoun immediately jumps in front</strong>:<br>• <em>Ich gebe <strong>es</strong> (Akk pronoun) dem Mann (Dat noun).</em><br>• If both are pronouns: Akkusativ comes before Dativ: <em>Ich gebe <strong>es ihm</strong>.</em>"}], "examples": [{"de": "Ich fahre morgen (Te) mit dem Fahrrad (Mo) zur Schule (Lo).", "en": "I am riding tomorrow by bike to school."}, {"de": "Er schenkt seiner Mutter (Dat) Blumen (Akk).", "en": "He gives his mother flowers."}, {"de": "Er schenkt sie (Akk) seiner Mutter (Dat).", "en": "He gives them to his mother."}, {"de": "Wir fliegen im Sommer (Te) wegen der Sonne (Ka) nach Spanien (Lo).", "en": "We are flying in summer for the sun to Spain."}, {"de": "Kannst du es mir bitte zeigen?", "en": "Can you please show it to me?"}]}, {"id": "a2-11", "title": "Subordinate Clauses with weil & dass (The Verb-Kickers)", "summary": "Master the hallmark of German sentence rhythm: subordinating conjunctions that kick the conjugated verb to the absolute end of the clause.", "rules": [{"label": "The Verb-Kicking Rule", "text": "In a subordinate clause (<em>Nebensatz</em>) introduced by <strong>weil</strong> (because) or <strong>dass</strong> (that), the conjugated verb is kicked to the <strong>VERY LAST POSITION</strong>.<br>A comma ALWAYS separates the main clause from the subordinate clause."}, {"label": "weil (because) vs. denn (for/because)", "text": "• <strong>weil</strong> (Nebensatz -> verb at the end):<br><em>Ich lerne Deutsch, weil ich in Deutschland arbeiten <strong>möchte</strong>.</em><br>• <strong>denn</strong> (Coordinating -> Position 0, normal V2 word order):<br><em>Ich lerne Deutsch, denn ich <strong>möchte</strong> in Deutschland arbeiten.</em>"}, {"label": "dass (that)", "text": "Introduces reported speech, thoughts, or beliefs:<br><em>Ich weiß, dass Deutsch lernen Spaß <strong>macht</strong>.</em><br><em>Ich hoffe, dass du morgen <strong>kommst</strong>.</em>"}, {"label": "Nebensatz at the Beginning (Verb-Verb Rule)", "text": "If the <em>weil</em> or <em>dass</em> clause comes first, the main clause begins immediately with its conjugated verb:<br><em>Weil es heute regnet, <strong>bleibe</strong> ich zu Hause.</em>"}], "examples": [{"de": "Ich bleibe im Bett, weil ich müde bin.", "en": "I am staying in bed because I am tired."}, {"de": "Sie hat gesagt, dass sie heute keine Zeit hat.", "en": "She said that she has no time today."}, {"de": "Weil der Bus Verspätung hatte, kam er zu spät.", "en": "Because the bus was delayed, he arrived late."}, {"de": "Wir freuen uns, dass ihr uns besuchen kommt.", "en": "We are glad that you are coming to visit us."}, {"de": "Er isst keinen Fisch, weil er ihn nicht mag.", "en": "He eats no fish because he does not like it."}]}, {"id": "a2-12", "title": "Conditional & Temporal Clauses: wenn vs. als", "summary": "Both mean 'when/if' in English, but German strictly differentiates conditions/repeated events (wenn) from a single past event (als).", "rules": [{"label": "When to Use 'wenn' (If / Whenever)", "text": "Use <strong>wenn</strong> for:<br>1. <strong>Conditions (if):</strong> <em>Wenn du Zeit hast, trinken wir einen Kaffee.</em><br>2. <strong>Repeated events in present or past (whenever / every time):</strong> <em>Immer wenn ich nach Berlin fahre, besuche ich das Museum.</em><br>Like <em>weil</em>, <em>wenn</em> kicks the verb to the end of the clause!"}, {"label": "When to Use 'als' (Single Past Event)", "text": "Use <strong>als</strong> strictly for a <strong>single, one-time completed event or life period in the past</strong>:<br>• <em><strong>Als</strong> ich ein Kind war, spielte ich oft draußen.</em><br>• <em><strong>Als</strong> ich gestern nach Hause kam, schlief mein Sohn schon.</em><br>Golden rule: You only grow up or turn 18 once -> always use <em>als</em>!"}], "examples": [{"de": "Wenn das Wetter morgen schön ist, machen wir ein Picknick.", "en": "If the weather is nice tomorrow, we will have a picnic."}, {"de": "Als ich 20 Jahre alt war, bin ich nach Spanien gereist.", "en": "When I was 20 years old, I traveled to Spain."}, {"de": "Ruf mich bitte an, wenn du am Bahnhof ankommst.", "en": "Please call me when you arrive at the train station."}, {"de": "Als der Film zu Ende war, gingen alle nach Hause.", "en": "When the movie was over, everyone went home."}, {"de": "Immer wenn es regnet, nehme ich die U-Bahn.", "en": "Whenever it rains, I take the subway."}]}, {"id": "a2-13", "title": "Reflexive Verbs in Akkusativ & Dativ", "summary": "Actions performed on oneself (sich freuen, sich anziehen, sich die Zähne putzen). Understand when reflexive pronouns use Akkusativ vs. Dativ.", "rules": [{"label": "Akkusativ Reflexive Pronouns", "text": "Used when there is NO other direct object in the sentence:<br>• ich freue <strong>mich</strong><br>• du freust <strong>dich</strong><br>• er/sie/es freut <span class='hl-ak'>sich</span><br>• wir freuen <strong>uns</strong><br>• ihr freut <strong>euch</strong><br>• sie/Sie freuen <span class='hl-ak'>sich</span>"}, {"label": "Dativ Reflexive Pronouns (When Body Part / Object is Specified)", "text": "If you specify the exact body part or object receiving the action, the reflexive pronoun shifts to <strong>Dativ</strong>!<br>Notice that ONLY 'ich' (<strong>mir</strong>) and 'du' (<strong>dir</strong>) change; all others stay 'sich / uns / euch / sich':<br>• <em>Ich wasche <strong>mich</strong>.</em> (Akkusativ — I wash myself)<br>• <em>Ich wasche <span class='hl-dat'>mir</span> die Hände (Akk).</em> (Dativ — I wash the hands for myself)<br>• <em>Du putzt <span class='hl-dat'>dir</span> die Zähne.</em>"}, {"label": "Common Reflexive Verbs", "text": "• <em>sich freuen auf/über</em> (to look forward to / be happy about)<br>• <em>sich interessieren für</em> (to be interested in)<br>• <em>sich fühlen</em> (to feel)<br>• <em>sich ausruhen</em> (to rest)<br>• <em>sich anziehen</em> (to get dressed)."}], "examples": [{"de": "Ich freue mich sehr auf unseren Urlaub.", "en": "I am looking forward very much to our vacation."}, {"de": "Er rasiert sich jeden Morgen vor dem Spiegel.", "en": "He shaves every morning in front of the mirror."}, {"de": "Ich muss mir erst die Haare waschen.", "en": "I have to wash my hair first."}, {"de": "Zieh dir bitte eine warme Jacke an!", "en": "Please put on a warm jacket!"}, {"de": "Wie fühlen Sie sich heute?", "en": "How are you feeling today?"}]}, {"id": "a2-14", "title": "Comparative, Superlative & Coordinating Conjunctions (ADUSO)", "summary": "Master comparisons (-er als, am -sten) and the 5 zero-position connecting words (ADUSO) that never mess with your verb order.", "rules": [{"label": "Comparative & Superlative Forms", "text": "• <strong>Equality:</strong> <em>so + Adjective + wie</em>: <em>Er ist so groß wie ich.</em> (He is as tall as me)<br>• <strong>Comparative:</strong> <em>Adjective + <strong>-er als</strong></em>: <em>Er ist größ<strong>er als</strong> ich.</em> (Short vowels often take umlauts: <em>alt -> älter, groß -> größer, jung -> jünger</em>).<br>• <strong>Superlative:</strong> <em><strong>am</strong> + Adjective + <strong>-sten</strong></em>: <em>Er ist <strong>am größten</strong>.</em>"}, {"label": "The 3 Big Irregular Comparatives", "text": "• <strong>gut -> besser -> am besten</strong> (good -> better -> best)<br>• <strong>viel -> mehr -> am meisten</strong> (much -> more -> most)<br>• <strong>gern -> lieber -> am liebsten</strong> (like -> prefer -> like most of all)."}, {"label": "ADUSO Conjunctions (Position 0 — No Word Order Change!)", "text": "These 5 coordinating conjunctions connect two main clauses and sit at <strong>Position 0</strong> (normal Subject-Verb-Object order follows!):<br>• <strong>A</strong>ber (but): <em>Ich will kommen, aber ich <strong>habe</strong> keine Zeit.</em><br>• <strong>D</strong>enn (because / for): <em>Er lernt fleißig, denn er <strong>will</strong> die Prüfung bestehen.</em><br>• <strong>U</strong>nd (and): <em>Wir trinken Kaffee und wir <strong>essen</strong> Kuchen.</em><br>• <strong>S</strong>ondern (but rather / on the contrary — after a negative): <em>Er kommt nicht heute, sondern er <strong>kommt</strong> morgen.</em><br>• <strong>O</strong>der (or): <em>Bleiben wir hier oder <strong>gehen</strong> wir ins Café?</em>"}], "examples": [{"de": "Der ICE ist schneller als der Regionalzug.", "en": "The ICE train is faster than the regional train."}, {"de": "Ich trinke gern Tee, aber ich trinke lieber Kaffee.", "en": "I like drinking tea, but I prefer drinking coffee."}, {"de": "Welcher Berg in Deutschland ist am höchsten? — Die Zugspitze.", "en": "Which mountain in Germany is the highest? — The Zugspitze."}, {"de": "Ich habe kein Auto, sondern ich fahre mit dem Fahrrad.", "en": "I do not have a car, but rather I ride by bicycle."}, {"de": "Deutsch ist interessant und es macht viel Spaß.", "en": "German is interesting and it is a lot of fun."}]}];
      var PHRASEBOOK_DATA = [{"id": "doctor", "title": "Beim Arzt & in der Apotheke (At the Doctor & Pharmacy)", "icon": "🩺", "desc": "How to describe symptoms, understand the doctor, and get medicine at the pharmacy.", "phrases": [{"de": "Ich habe einen Termin um 10 Uhr bei Dr. Müller.", "en": "I have an appointment at 10:00 with Dr. Müller."}, {"de": "Was fehlt Ihnen? / Wo tut es weh?", "en": "What is troubling you? / Where does it hurt?"}, {"de": "Ich fühle mich seit zwei Tagen nicht gut.", "en": "I haven't been feeling well for two days."}, {"de": "Ich habe starke Kopfschmerzen und hohes Fieber.", "en": "I have a severe headache and high fever."}, {"de": "Mein Hals tut weh und ich kann kaum schlucken.", "en": "My throat hurts and I can barely swallow."}, {"de": "Mir ist schwindelig und übel.", "en": "I feel dizzy and nauseous."}, {"de": "Ich brauche ein Rezept für dieses Medikament.", "en": "I need a prescription for this medication."}, {"de": "Nehmen Sie die Tabletten dreimal täglich nach dem Essen.", "en": "Take the tablets three times a day after meals."}, {"de": "Brauchen Sie eine Arbeitsunfähigkeitsbescheinigung (Krankschreibung)?", "en": "Do you need a sick note for work?"}, {"de": "Gute Besserung!", "en": "Get well soon!"}]}, {"id": "supermarket", "title": "Im Supermarkt & beim Bäcker (Grocery & Bakery)", "icon": "🛒", "desc": "Ordering bread and cheese, asking for items, and navigating the checkout.", "phrases": [{"de": "Ich hätte gerne zwei Brötchen und ein Vollkornbrot.", "en": "I would like two rolls and a whole grain bread."}, {"de": "Darf es sonst noch etwas sein?", "en": "Would you like anything else?"}, {"de": "Nein danke, das ist alles / Das wär's, danke!", "en": "No thank you, that is all / That'll be it, thanks!"}, {"de": "Entschuldigung, wo finde ich die Butter?", "en": "Excuse me, where can I find the butter?"}, {"de": "Hundert Gramm von diesem Käse, bitte.", "en": "One hundred grams of this cheese, please."}, {"de": "Zahlen Sie bar oder mit Karte?", "en": "Are you paying cash or by card?"}, {"de": "Mit Karte, bitte.", "en": "By card, please."}, {"de": "Sammeln Sie Payback-Punkte?", "en": "Do you collect loyalty/Payback points?"}, {"de": "Brauchen Sie den Kassenbon (Beleg)?", "en": "Do you need the receipt?"}, {"de": "Schönen Feierabend! — Danke, ebenfalls!", "en": "Have a nice evening! — Thanks, you too!"}]}, {"id": "restaurant", "title": "Im Restaurant & Café (Dining Out)", "icon": "🍽️", "desc": "Reserving, ordering food and drinks, asking questions, and paying with tips.", "phrases": [{"de": "Haben Sie einen Tisch für zwei Personen frei?", "en": "Do you have a table free for two people?"}, {"de": "Wir haben einen Tisch auf den Namen Schmidt reserviert.", "en": "We reserved a table under the name Schmidt."}, {"de": "Könnten wir bitte die Speisekarte haben?", "en": "Could we please have the menu?"}, {"de": "Was können Sie heute empfehlen?", "en": "What can you recommend today?"}, {"de": "Ich nehme das Schnitzel mit Kartoffelsalat.", "en": "I'll take the schnitzel with potato salad."}, {"de": "Für mich bitte ein stilles Wasser (ohne Kohlensäure).", "en": "For me a still water (without gas), please."}, {"de": "Guten Appetit! — Danke, gleichfalls!", "en": "Enjoy your meal! — Thanks, likewise!"}, {"de": "Hat es Ihnen geschmeckt? — Ja, es war köstlich!", "en": "Did you enjoy it? — Yes, it was delicious!"}, {"de": "Wir möchten bitte zahlen. Zusammen oder getrennt?", "en": "We would like to pay, please. Together or separate?"}, {"de": "Machen Sie bitte 25 Euro. (Stimmt so!)", "en": "Make it 25 euros, please. (Keep the change!)"}]}, {"id": "directions", "title": "Nach dem Weg fragen & Verkehr (Directions & Transport)", "icon": "🗺️", "desc": "Finding your way around town, buying transit tickets, and understanding platform announcements.", "phrases": [{"de": "Entschuldigung, wie komme ich zum Hauptbahnhof?", "en": "Excuse me, how do I get to the central station?"}, {"de": "Gehen Sie geradeaus und an der Kreuzung nach links.", "en": "Walk straight ahead and at the intersection turn left."}, {"de": "Ist das weit von hier? — Nein, nur fünf Minuten zu Fuß.", "en": "Is it far from here? — No, only five minutes on foot."}, {"de": "Fährt diese U-Bahn zum Flughafen?", "en": "Does this subway train go to the airport?"}, {"de": "Muss ich umsteigen?", "en": "Do I have to change trains / transfer?"}, {"de": "Sie müssen am Marienplatz in die S3 umsteigen.", "en": "You have to transfer to the S3 at Marienplatz."}, {"de": "Von welchem Gleis fährt der ICE nach Frankfurt ab?", "en": "From which platform does the ICE to Frankfurt depart?"}, {"de": "Der Zug hat voraussichtlich zwanzig Minuten Verspätung.", "en": "The train is expected to be twenty minutes late."}, {"de": "Ein Einzelticket für die Zone A, bitte.", "en": "A single ticket for zone A, please."}, {"de": "Vorsicht an der Bahnsteigkante und zurücktreten bitte!", "en": "Caution at the platform edge and please stand back!"}]}, {"id": "phone", "title": "Am Telefon & Termine (Phone Calls & Appointments)", "icon": "📞", "desc": "Answering professionally, making/moving appointments, and spelling your name.", "phrases": [{"de": "Guten Tag, hier spricht Anna Weber.", "en": "Good day, Anna Weber speaking."}, {"de": "Ich möchte gerne einen Termin vereinbaren.", "en": "I would like to arrange an appointment."}, {"de": "Passt es Ihnen am kommenden Dienstag um 14 Uhr?", "en": "Does next Tuesday at 14:00 suit you?"}, {"de": "Ja, Dienstag um 14 Uhr passt mir sehr gut.", "en": "Yes, Tuesday at 14:00 suits me very well."}, {"de": "Ich muss meinen Termin am Freitag leider absagen / verschieben.", "en": "Unfortunately I have to cancel / postpone my Friday appointment."}, {"de": "Könnten Sie das bitte wiederholen? Die Verbindung ist schlecht.", "en": "Could you please repeat that? The connection is bad."}, {"de": "Wie schreibt man Ihren Nachnamen? Können Sie das buchstabieren?", "en": "How do you spell your surname? Could you spell that out?"}, {"de": "       var ADJECTIVE_GUIDE = {"title": "Master Adjective Endings (Adjektivdeklination)", "summary": "Adjective endings change depending on the article in front (Definite, Indefinite, or No Article). Follow these 3 intuitive rules to get them right every time.", "pan_rule": {"title": "The Famous 'Pan' Rule for Definite Articles (der / die / das)", "desc": "Look at the table below: in the center, there is a cluster of 5 forms that end in <strong>-e</strong> (like the bowl of a frying pan). <strong>EVERY OTHER FORM ends in -en!</strong> That means all Dative forms, all Plural forms, and masculine Accusative ALWAYS end in <strong>-en</strong>."}, "type1_weak": {"title": "Type 1: Weak Declension (After 'der / die / das / dieser / jeder')", "desc": "Because the article already signals the gender clearly, the adjective only needs minimal endings (-e or -en).", "rows": [{"case": "Nominativ", "m": "der neu<strong>e</strong> Tisch", "f": "die neu<strong>e</strong> Lampe", "n": "das neu<strong>e</strong> Buch", "pl": "die neu<strong>en</strong> Bücher"}, {"case": "Akkusativ", "m": "den neu<strong>en</strong> Tisch", "f": "die neu<strong>e</strong> Lampe", "n": "das neu<strong>e</strong> Buch", "pl": "die neu<strong>en</strong> Bücher"}, {"case": "Dativ", "m": "dem neu<strong>en</strong> Tisch", "f": "der neu<strong>en</strong> Lampe", "n": "dem neu<strong>en</strong> Tisch", "pl": "den neu<strong>en</strong> Büchern"}], "examples": [{"de": "Der neue Wagen fährt sehr schnell.", "en": "The new car drives very fast."}, {"de": "Ich habe den schwarzen Mantel gekauft.", "en": "I bought the black coat."}, {"de": "Wir helfen der alten Dame über die Straße.", "en": "We help the elderly lady across the street."}]}, "type2_mixed": {"title": "Type 2: Mixed Declension (After 'ein / eine / kein / mein / dein / sein / ihr / unser / euer')", "desc": "When the article lacks an ending ('ein', 'kein', 'mein'), the adjective MUST step in and show the gender (-er for masculine, -es for neuter!). All Dative and Plurals take -en.", "rows": [{"case": "Nominativ", "m": "ein neu<strong>er</strong> Tisch", "f": "eine neu<strong>e</strong> Lampe", "n": "ein neu<strong>es</strong> Buch", "pl": "keine neu<strong>en</strong> Bücher"}, {"case": "Akkusativ", "m": "einen neu<strong>en</strong> Tisch", "f": "eine neu<strong>e</strong> Lampe", "n": "ein neu<strong>es</strong> Buch", "pl": "keine neu<strong>en</strong> Bücher"}, {"case": "Dativ", "m": "einem neu<strong>en</strong> Tisch", "f": "einer neu<strong>en</strong> Lampe", "n": "einem neu<strong>en</strong> Buch", "pl": "keinen neu<strong>en</strong> Büchern"}], "examples": [{"de": "Er ist ein sehr netter Kollege.", "en": "He is a very nice colleague."}, {"de": "Ich suche ein kleines Zimmer in Berlin.", "en": "I am looking for a small room in Berlin."}, {"de": "Mit meinen besten Freunden feiere ich Geburtstag.", "en": "With my best friends I celebrate my birthday."}]}, "type3_strong": {"title": "Type 3: Strong Declension (Zero Article: No article in front!)", "desc": "When there is no article at all (e.g. 'cold water', 'fresh bread'), the adjective itself carries the full case signal of 'der/die/das' (-er, -e, -es, -em, -en).", "rows": [{"case": "Nominativ", "m": "frisch<strong>er</strong> Kaffee", "f": "kalt<strong>e</strong> Milch", "n": "frisch<strong>es</strong> Brot", "pl": "süß<strong>e</strong> Äpfel"}, {"case": "Akkusativ", "m": "frisch<strong>en</strong> Kaffee", "f": "kalt<strong>e</strong> Milch", "n": "frisch<strong>es</strong> Brot", "pl": "süß<strong>e</strong> Äpfel"}, {"case": "Dativ", "m": "mit frisch<strong>em</strong> Kaffee", "f": "mit kalt<strong>er</strong> Milch", "n": "mit frisch<strong>em</strong> Brot", "pl": "mit süß<strong>en</strong> Äpfeln"}], "examples": [{"de": "Ich trinke gerne heißen Tee am Morgen.", "en": "I like drinking hot tea in the morning."}, {"de": "Gutes Essen hält Leib und Seele zusammen.", "en": "Good food holds body and soul together."}, {"de": "Aus frischem Obst machen wir einen Saft.", "en": "From fresh fruit we make a juice."}]}};
      var TRAPS_DATA = {"false_friends": [{"word": "bekommen vs. become", "trap": "'bekommen' does NOT mean 'to become'!", "meaning": "<strong>bekommen</strong> = to get / receive.<br>To become in German is <strong>werden</strong>.", "ex": "Ich <em>bekomme</em> ein Paket (I get a parcel). / Er <em>wird</em> Arzt (He is becoming a doctor)."}, {"word": "aktuell vs. actual", "trap": "'aktuell' does NOT mean 'actual'!", "meaning": "<strong>aktuell</strong> = current / up-to-date / topical.<br>Actual in German is <strong>tatsächlich</strong> or <strong>wirklich</strong>.", "ex": "Das ist die <em>aktuelle</em> Adresse (current address). / Das ist der <em>tatsächliche</em> Preis (actual price)."}, {"word": "das Gift vs. gift", "trap": "'Gift' in German means POISON!", "meaning": "<strong>das Gift</strong> = poison.<br>A present or gift is <strong>das Geschenk</strong>.", "ex": "Vorsicht, das ist <em>Gift</em>! / Danke für das schöne <em>Geschenk</em>!"}, {"word": "der Chef vs. chef", "trap": "'Chef' in German is your boss at work!", "meaning": "<strong>der Chef / die Chefin</strong> = boss / manager.<br>A professional kitchen cook or chef is <strong>der Koch / die Köchin</strong>.", "ex": "Mein <em>Chef</em> leitet die Abteilung. / Der <em>Koch</em> im Restaurant macht tolles Essen."}, {"word": "das Gymnasium vs. gym", "trap": "'Gymnasium' is a secondary school, not a workout gym!", "meaning": "<strong>das Gymnasium</strong> = academic high school preparing for university.<br>A sports gym is <strong>das Fitnessstudio</strong>.", "ex": "Meine Tochter geht aufs <em>Gymnasium</em>. / Ich trainiere im <em>Fitnessstudio</em>."}, {"word": "brav vs. brave", "trap": "'brav' does not mean courageous!", "meaning": "<strong>brav</strong> = well-behaved / obedient (said of children and dogs).<br>Brave/courageous is <strong>mutig</strong>.", "ex": "Die Kinder waren heute sehr <em>brav</em>. / Der Feuerwehrmann war sehr <em>mutig</em>."}, {"word": "Ich bin kalt vs. Mir ist kalt", "trap"
