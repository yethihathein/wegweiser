      function renderVocabView(filterQuery) {
        var q = (filterQuery || "").toLowerCase().trim();
        var list = VOCAB_BANK.filter(function (v) {
          var matchesCat = (activeVocabCat === "all") || (v.cat === activeVocabCat);
          if (!matchesCat) return false;
          if (!q) return true;
          return v.w.toLowerCase().indexOf(q) !== -1 || v.en.toLowerCase().indexOf(q) !== -1 || (v.ex && v.ex.toLowerCase().indexOf(q) !== -1);
        });

        var categories = [
          { id: "all", label: "All (" + VOCAB_BANK.length + ")" },
          { id: "basics", label: "Basics (30)" },
          { id: "food", label: "Food & Drinks (35)" },
          { id: "home", label: "Home & Living (30)" },
          { id: "city", label: "City & Travel (35)" },
          { id: "people", label: "Family & People (25)" },
          { id: "work", label: "Work & School (25)" },
          { id: "health", label: "Body & Health (25)" },
          { id: "shopping", label: "Shopping & Clothes (25)" },
          { id: "time_weather", label: "Time & Weather (25)" },
          { id: "adjectives", label: "Adjectives (30)" },
          { id: "verbs", label: "Core Verbs (35)" }
        ];

        var html = '<div class="space-y-6">';
        
        html += '<div class="p-4 sm:p-5 rounded-xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 shadow-sm flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 sm:gap-4">';
        html += '  <div>';
        html += '    <h1 class="text-lg sm:text-xl font-bold tracking-tight">Essential A1 & A2 Vocabulary Bank</h1>';
        html += '    <p class="text-xs text-zinc-600 dark:text-zinc-400 mt-1">320+ high-yield words color-coded by gender (der = blue, die = red, das = green) with native audio.</p>';
        html += '  </div>';
        html += '  <div class="w-full sm:w-64">';
        html += '    <input id="vocab-search-input" type="text" value="' + (filterQuery || '') + '" placeholder="Filter vocabulary..." class="w-full px-3 py-1.5 text-xs rounded-lg border border-zinc-300 dark:border-zinc-700 bg-zinc-50 dark:bg-zinc-800 text-zinc-900 dark:text-zinc-100 focus:outline-none focus:ring-2 focus:ring-indigo-500">';
        html += '  </div>';
        html += '</div>';

        // Category Filter Buttons
        html += '<div class="overflow-x-auto custom-scroll pb-1 -mx-2 px-2 sm:mx-0 sm:px-0">';
        html += '  <div class="flex items-center gap-1.5 text-xs whitespace-nowrap min-w-max">';
        categories.forEach(function (cat) {
          var isActive = cat.id === activeVocabCat;
          html += '    <button type="button" data-vcat="' + cat.id + '" class="vcat-btn px-2.5 py-1 rounded-md border transition-all active:scale-95 touch-manipulation ' + (isActive ? 'bg-indigo-600 text-white border-indigo-600 font-semibold' : 'bg-white dark:bg-zinc-800/80 text-zinc-600 dark:text-zinc-300 border-zinc-200 dark:border-zinc-700 hover:bg-zinc-100 dark:hover:bg-zinc-700') + '">' + cat.label + '</button>';
        });
        html += '  </div>';
        html += '</div>';

        // Cards Grid
        html += '<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2.5 sm:gap-3">';
        if (list.length === 0) {
          html += '<div class="col-span-full py-12 text-center text-xs text-zinc-400">No vocabulary words found matching current filters.</div>';
        } else {
          list.forEach(function (v) {
            var genderClass = v.art === "der" ? "gender-der" : (v.art === "die" ? "gender-die" : (v.art === "das" ? "gender-das" : ""));
            html += '<div class="p-3 sm:p-3.5 rounded-lg border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 shadow-sm space-y-2 flex flex-col justify-between">';
            
            html += '  <div>';
            html += '    <div class="flex items-start justify-between gap-2">';
            html += '      <div class="min-w-0">';
            html += '        <span class="text-sm font-bold ' + genderClass + ' break-words">' + v.w + '</span>';
            if (v.pl) {
              html += '        <div class="text-[11px] font-mono text-zinc-500 dark:text-zinc-400 break-words">Pl: ' + v.pl + '</div>';
            }
            html += '      </div>';
            html += '      <div class="shrink-0">' + renderAudioBtn(v.w) + '</div>';
            html += '    </div>';
            html += '    <div class="text-xs text-zinc-600 dark:text-zinc-400 mt-1 break-words">' + v.en + '</div>';
            html += '  </div>';

            html += '  <div class="pt-2 border-t border-zinc-100 dark:border-zinc-800/80 text-xs flex items-end justify-between gap-2">';
            html += '    <div class="min-w-0">';
            html += '      <div class="font-medium text-zinc-800 dark:text-zinc-200 break-words">' + v.ex + '</div>';
            html += '      <div class="text-[11px] text-zinc-500 dark:text-zinc-400 break-words">' + v.enEx + '</div>';
            html += '    </div>';
            html += '    <div class="shrink-0">' + renderAudioBtn(v.ex) + '</div>';
            html += '  </div>';

            html += '</div>';
          });
        }
        html += '</div>';

        html += '</div>';
        return html;
      }

      // Curated Media View
      function renderMediaView() {
        var html = '<div class="space-y-6">';
        
        html += '<div class="p-4 sm:p-5 rounded-xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 shadow-sm">';
        html += '  <h1 class="text-lg sm:text-xl font-bold tracking-tight">Best Free German Audio & Video Resources</h1>';
        html += '  <p class="text-xs text-zinc-600 dark:text-zinc-400 mt-1">Hand-picked, high-yield audio/video courses for A1 and A2 learners. 100% free with verified deep search links.</p>';
        html += '</div>';

        html += '<div class="grid grid-cols-1 md:grid-cols-2 gap-3 sm:gap-4">';
        MEDIA_RESOURCES.forEach(function (m) {
          html += '<div class="p-4 sm:p-5 rounded-xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 shadow-sm space-y-3 flex flex-col justify-between">';
          html += '  <div>';
          html += '    <div class="flex items-center justify-between gap-2 mb-1.5">';
          html += '      <span class="px-2 py-0.5 rounded text-[10px] font-bold tracking-wider bg-indigo-50 dark:bg-indigo-950/60 text-indigo-700 dark:text-indigo-300 uppercase">' + m.badge + '</span>';
          html += '      <span class="text-xs font-mono font-semibold text-zinc-500">' + m.level + '</span>';
          html += '    </div>';
          html += '    <h2 class="text-sm sm:text-base font-bold text-zinc-900 dark:text-zinc-100">' + m.title + '</h2>';
          html += '    <div class="text-xs text-zinc-500 dark:text-zinc-400 font-medium mt-0.5">' + m.provider + ' · ' + m.type + '</div>';
          html += '    <p class="text-xs text-zinc-700 dark:text-zinc-300 mt-2.5 leading-relaxed">' + m.desc + '</p>';
          html += '  </div>';
          html += '  <div class="pt-3 border-t border-zinc-100 dark:border-zinc-800">';
          html += '    <a href="' + m.url + '" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 text-xs font-semibold text-indigo-600 dark:text-indigo-400 hover:text-indigo-700 dark:hover:text-indigo-300">';
          html += '      <span>Open Free Course / Search</span>';
          html += '      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';
          html += '    </a>';
          html += '  </div>';
          html += '</div>';
        });
        html += '</div>';

        html += '</div>';
        return html;
      }

      /* ==================================================================== */
      /* TAB NAVIGATION & APP CONTROLLER                                      */
      /* ==================================================================== */
      var currentTab = "a1";

      function switchTab(tabId, optionalQuery) {
        currentTab = tabId;

        // Update Nav button styles
        var navBtns = document.querySelectorAll(".nav-tab");
        navBtns.forEach(function (btn) {
          if (btn.getAttribute("data-tab") === tabId) {
            btn.className = "nav-tab px-3 py-1.5 rounded-md bg-indigo-600 text-white font-semibold";
            // Scroll selected tab into view smoothly on mobile
            try {
              btn.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
            } catch(e) {}
          } else {
            btn.className = "nav-tab px-3 py-1.5 rounded-md text-zinc-600 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-100 hover:bg-zinc-100 dark:hover:bg-zinc-800";
          }
        });

        // Render appropriate content view
        var container = document.getElementById("tab-content");
        if (tabId === "a1") {
          container.innerHTML = renderLessons(A1_LESSONS, "A1");
        } else if (tabId === "a2") {
          container.innerHTML = renderLessons(A2_LESSONS, "A2");
        } else if (tabId === "phrases") {
          container.innerHTML = renderPhrasesView();
        } else if (tabId === "tables") {
          container.innerHTML = renderTablesView();
        } else if (tabId === "adjectives") {
          container.innerHTML = renderAdjectivesView();
        } else if (tabId === "wechsel") {
          container.innerHTML = renderWechselView();
          attachWechselListeners();
        } else if (tabId === "traps") {
          container.innerHTML = renderTrapsView();
        } else if (tabId === "verbs") {
          container.innerHTML = renderVerbsView(optionalQuery);
          attachVerbListeners();
        } else if (tabId === "vocab") {
          container.innerHTML = renderVocabView(optionalQuery);
          attachVocabListeners();
        } else if (tabId === "media") {
          container.innerHTML = renderMediaView();
        }

        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function attachWechselListeners() {
        var scenBtns = document.querySelectorAll(".scen-btn");
        scenBtns.forEach(function (btn) {
          btn.addEventListener("click", function () {
            activeScenarioId = this.getAttribute("data-scen");
            var container = document.getElementById("tab-content");
            container.innerHTML = renderWechselView();
            attachWechselListeners();
          });
        });

        var btnWo = document.getElementById("btn-mode-wo");
        if (btnWo) {
          btnWo.addEventListener("click", function () {
            activeCaseMode = "wo";
            var container = document.getElementById("tab-content");
            container.innerHTML = renderWechselView();
            attachWechselListeners();
          });
        }

        var btnWohin = document.getElementById("btn-mode-wohin");
        if (btnWohin) {
          btnWohin.addEventListener("click", function () {
            activeCaseMode = "wohin";
            var container = document.getElementById("tab-content");
            container.innerHTML = renderWechselView();
            attachWechselListeners();
          });
        }
      }

      function attachVerbListeners() {
        var input = document.getElementById("verb-search-input");
        if (input) {
          input.addEventListener("input", function () {
            var query = this.value;
            var container = document.getElementById("tab-content");
            container.innerHTML = renderVerbsView(query);
            attachVerbListeners();
            var updatedInput = document.getElementById("verb-search-input");
            if (updatedInput) {
              updatedInput.focus();
              updatedInput.selectionStart = updatedInput.selectionEnd = updatedInput.value.length;
            }
          });
        }
      }

      function attachVocabListeners() {
        var catBtns = document.querySelectorAll(".vcat-btn");
        catBtns.forEach(function (btn) {
          btn.addEventListener("click", function () {
            activeVocabCat = this.getAttribute("data-vcat");
            var input = document.getElementById("vocab-search-input");
            var q = input ? input.value : "";
            var container = document.getElementById("tab-content");
            container.innerHTML = renderVocabView(q);
            attachVocabListeners();
          });
        });

        var input = document.getElementById("vocab-search-input");
        if (input) {
          input.addEventListener("input", function () {
            var query = this.value;
            var container = document.getElementById("tab-content");
            container.innerHTML = renderVocabView(query);
            attachVocabListeners();
            var updatedInput = document.getElementById("vocab-search-input");
            if (updatedInput) {
              updatedInput.focus();
              updatedInput.selectionStart = updatedInput.selectionEnd = updatedInput.value.length;
            }
          });
        }
      }

      // Nav Tab Click Delegation
      document.getElementById("nav-tabs").addEventListener("click", function (e) {
        var btn = e.target.closest("button[data-tab]");
        if (btn) {
          switchTab(btn.getAttribute("data-tab"));
        }
      });

      // Top Quick Search Input: Handlers for Desktop and Mobile inputs
      function handleQuickSearch(val) {
        var trimmed = (val || "").trim();
        if (!trimmed) return;
        var valLower = trimmed.toLowerCase();

        var isVerbMatch = TOP_VERBS.some(function (v) { return v.inf.toLowerCase() === valLower; });
        if (isVerbMatch) {
          switchTab("verbs", trimmed);
          return;
        }
        var isPhraseMatch = PHRASEBOOK_DATA.some(function (sec) {
          return sec.title.toLowerCase().indexOf(valLower) !== -1 || sec.phrases.some(function (p) { return p.de.toLowerCase().indexOf(valLower) !== -1 || p.en.toLowerCase().indexOf(valLower) !== -1; });
        });
        if (isPhraseMatch) {
          switchTab("phrases");
          return;
        }
        switchTab("vocab", trimmed);
      }

      var quickSearchDesktop = document.getElementById("quick-search-desktop");
      if (quickSearchDesktop) {
        quickSearchDesktop.addEventListener("keydown", function (e) {
          if (e.key === "Enter") handleQuickSearch(this.value);
        });
      }

      if (quickSearchMobile) {
        quickSearchMobile.addEventListener("keydown", function (e) {
          if (e.key === "Enter") {
            handleQuickSearch(this.value);
            if (mobileSearchContainer) mobileSearchContainer.classList.add("hidden");
          }
        });
      }

      // Initial View Boot
      switchTab("a1");

    })();
  </script>
</body>
</html>
